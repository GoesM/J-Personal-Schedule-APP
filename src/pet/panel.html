<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>J人随手清单</title><link rel="stylesheet" href="pet.css"></head><body class="panel-page">
<header><strong>随手看一眼</strong><div><button id="pin" aria-pressed="false">固定</button><button id="close" aria-label="收起清单">×</button></div></header>
<section id="notice" hidden role="status"><strong id="notice-title"></strong><p id="notice-detail"></p><div><button id="snooze">5分钟后提醒</button><button id="dismiss">知道了</button></div></section>
<nav><button data-tab="today" aria-pressed="true">今日</button><button data-tab="long" aria-pressed="false">长期</button></nav>
<div class="meta"><span id="count">正在读取…</span><label><input id="completed" type="checkbox">已完成</label></div>
<main id="items" aria-label="待办事项"></main><button id="more" hidden>显示更多</button>
<form id="add"><input id="title" maxlength="200" required placeholder="记一件今天要做的事…" aria-label="新增TODO内容"><button type="submit">＋</button></form>
<footer><span id="status" role="status" aria-live="polite">本机清单 · 云端请在主程序同步</span><button id="main">打开主程序</button></footer>
<script src="panel.js"></script></body></html>
